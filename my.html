<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mobile HTML Web Editor</title>
                <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; }
                                body { font-family: sans-serif; display: flex; flex-direction: column; h-height: 100vh; background: #1e1e1e; color: #fff; }
                                        header { padding: 10px; background: #111; text-align: center; font-weight: bold; font-size: 14px; border-bottom: 1px solid #333; }
                                                .editor-container { flex: 1; display: flex; flex-direction: column; position: relative; }
                                                        textarea { flex: 1; width: 100%; height: 50vh; background: #1e1e1e; color: #00ff00; border: none; padding: 10px; font-family: monospace; font-size: 14px; resize: none; outline: none; }
                                                                
                                                                        /* Baris Tombol Pintas Khusus Keyboard HP */
                                                                                .shortcut-bar { display: flex; background: #2d2d2d; overflow-x: auto; padding: 5px; gap: 5px; border-top: 1px solid #444; border-bottom: 1px solid #444; }
                                                                                        .shortcut-bar button { background: #444; color: #fff; border: none; padding: 8px 12px; font-family: monospace; font-size: 14px; border-radius: 4px; cursor: pointer; }
                                                                                                .shortcut-bar button:active { background: #007acc; }

                                                                                                        /* Area Preview */
                                                                                                                .preview-container { flex: 1; height: 40vh; background: #fff; border-top: 2px solid #007acc; }
                                                                                                                        iframe { width: 100%; height: 100%; border: none; background: #fff; }
                                                                                                                            </style>
                                                                                                                            </head>
                                                                                                                            <body>

                                                                                                                                <header>🛠️ MINI HTML EDITOR MOBILE</header>

                                                                                                                                    <div class="editor-container">
                                                                                                                                            <!-- Area Ketik Kode -->
                                                                                                                                                    <textarea id="code-input" placeholder="Ketik kode HTML/CSS/JS di sini..."></textarea>
                                                                                                                                                            
                                                                                                                                                                    <!-- Tombol Pintas Biar Gak Pegal Ngetik di HP -->
                                                                                                                                                                            <div class="shortcut-bar">
                                                                                                                                                                                        <button onclick="insertCode('<>')">&lt;&gt;</button>
                                                                                                                                                                                                    <button onclick="insertCode('</>')">&lt;/&gt;</button>
                                                                                                                                                                                                                <button onclick="insertCode('\"')">"</button>
                                                                                                                                                                                                                            <button onclick="insertCode('{ }')">{ }</button>
                                                                                                                                                                                                                                        <button onclick="insertCode('style')">style</button>
                                                                                                                                                                                                                                                    <button onclick="insertCode('script')">script</button>
                                                                                                                                                                                                                                                                <button onclick="insertCode('div')">div</button>
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                <!-- Area Live Preview -->
                                                                                                                                                                                                                                                                                    <div class="preview-container">
                                                                                                                                                                                                                                                                                            <iframe id="preview-output"></iframe>
                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                            const codeInput = document.getElementById('code-input');
                                                                                                                                                                                                                                                                                                                    const previewOutput = document.getElementById('preview-output');

                                                                                                                                                                                                                                                                                                                            // Fungsi Otomatis Render Preview saat Mengetik
                                                                                                                                                                                                                                                                                                                                    codeInput.addEventListener('input', () => {
                                                                                                                                                                                                                                                                                                                                                const code = codeInput.value;
                                                                                                                                                                                                                                                                                                                                                            const iframeDoc = previewOutput.contentDocument || previewOutput.contentWindow.document;
                                                                                                                                                                                                                                                                                                                                                                        iframeDoc.open();
                                                                                                                                                                                                                                                                                                                                                                                    iframeDoc.write(code);
                                                                                                                                                                                                                                                                                                                                                                                                iframeDoc.close();
                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                // Fungsi Memasukkan Tombol Pintas ke Kursor
                                                                                                                                                                                                                                                                                                                                                                                                                        function insertCode(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    const start = codeInput.selectionStart;
                                                                                                                                                                                                                                                                                                                                                                                                                                                const end = codeInput.selectionEnd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            const currentVal = codeInput.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        codeInput.value = currentVal.substring(0, start) + text + currentVal.substring(end);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    codeInput.selectionStart = codeInput.selectionEnd = start + text.length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                codeInput.focus();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Trigger preview otomatis setelah tombol ditekan
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        codeInput.dispatchEvent(new Event('input'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
